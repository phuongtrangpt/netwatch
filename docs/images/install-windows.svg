<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="Cài NetWatch trên Windows"><style>text{font-family:Arial,DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="610" rx="0" fill="#f3f7f3" stroke="none"/><rect x="0" y="0" width="1200" height="135" rx="0" fill="#153c31" stroke="none"/><text x="40" y="58" font-size="31" fill="#d3f3a7" font-weight="700">Cài NetWatch trên Windows</text><text x="40" y="99" font-size="18" fill="#c0d4c8" font-weight="400">Windows 10/11 x64 · Gói portable đã kèm Node.js</text><rect x="40" y="165" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="58" y="183" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="70" y="211" font-size="24" fill="#173d34" font-weight="700">1</text><text x="114" y="210" font-size="22" fill="#173d34" font-weight="700">Tải đúng gói Windows</text><text x="64" y="253" font-size="17" fill="#607668" font-weight="400">Vào GitHub Releases → tải ZIP Windows x64.</text><text x="64" y="280" font-size="17" fill="#607668" font-weight="400">Không chọn Source code.</text><rect x="620" y="165" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="638" y="183" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="650" y="211" font-size="24" fill="#173d34" font-weight="700">2</text><text x="694" y="210" font-size="22" fill="#173d34" font-weight="700">Giải nén đầy đủ</text><text x="644" y="253" font-size="17" fill="#607668" font-weight="400">Ví dụ: C:\NetWatch</text><text x="644" y="280" font-size="17" fill="#607668" font-weight="400">Giữ nguyên các file và thư mục trong ZIP.</text><rect x="40" y="345" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="58" y="363" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="70" y="391" font-size="24" fill="#173d34" font-weight="700">3</text><text x="114" y="390" font-size="22" fill="#173d34" font-weight="700">Chạy Start-NetWatch.bat</text><text x="64" y="433" font-size="17" fill="#607668" font-weight="400">Lần đầu: tạo mật khẩu admin ≥ 12 ký tự.</text><text x="64" y="460" font-size="17" fill="#607668" font-weight="400">Giữ cửa sổ chạy để NetWatch hoạt động.</text><rect x="620" y="345" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="638" y="363" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="650" y="391" font-size="24" fill="#173d34" font-weight="700">4</text><text x="694" y="390" font-size="22" fill="#173d34" font-weight="700">Mở trang quản trị</text><text x="644" y="433" font-size="17" fill="#607668" font-weight="400">Trên máy cài: http://localhost:8080</text><text x="644" y="460" font-size="17" fill="#607668" font-weight="400">Máy khác: http://IP_MAY_CHU:8080</text><text x="40" y="573" font-size="16" fill="#315a46" font-weight="400">Cập nhật: dừng bản cũ → sao lưu → giải nén bản mới → chép nguyên thư mục data.</text></svg>