<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="Cài NetWatch trên Home Assistant OS"><style>text{font-family:Arial,DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="1200" height="610" rx="0" fill="#f3f7f3" stroke="none"/><rect x="0" y="0" width="1200" height="135" rx="0" fill="#153c31" stroke="none"/><text x="40" y="58" font-size="31" fill="#d3f3a7" font-weight="700">Cài NetWatch trên Home Assistant OS</text><text x="40" y="99" font-size="18" fill="#c0d4c8" font-weight="400">Hướng dẫn theo bước · Tên Apps / Add-ons tùy phiên bản Home Assistant</text><rect x="40" y="165" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="58" y="183" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="70" y="211" font-size="24" fill="#173d34" font-weight="700">1</text><text x="114" y="210" font-size="22" fill="#173d34" font-weight="700">Thêm kho ứng dụng</text><text x="64" y="253" font-size="17" fill="#607668" font-weight="400">Settings → Apps/Add-ons → Store</text><text x="64" y="280" font-size="17" fill="#607668" font-weight="400">Repositories → thêm URL kho NetWatch.</text><rect x="620" y="165" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="638" y="183" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="650" y="211" font-size="24" fill="#173d34" font-weight="700">2</text><text x="694" y="210" font-size="22" fill="#173d34" font-weight="700">Cài NetWatch Local</text><text x="644" y="253" font-size="17" fill="#607668" font-weight="400">Tìm NetWatch Local trong kho ứng dụng.</text><text x="644" y="280" font-size="17" fill="#607668" font-weight="400">Chọn Install và đợi cài đặt hoàn tất.</text><rect x="40" y="345" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="58" y="363" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="70" y="391" font-size="24" fill="#173d34" font-weight="700">3</text><text x="114" y="390" font-size="22" fill="#173d34" font-weight="700">Điền cấu hình</text><text x="64" y="433" font-size="17" fill="#607668" font-weight="400">password: mật khẩu riêng ≥ 12 ký tự.</text><text x="64" y="460" font-size="17" fill="#607668" font-weight="400">ingest_url: http://IP_MAY_CHU:8080</text><rect x="620" y="345" width="560" height="160" rx="14" fill="white" stroke="#d9e5db"/><rect x="638" y="363" width="40" height="40" rx="12" fill="#c7eea1" stroke="none"/><text x="650" y="391" font-size="24" fill="#173d34" font-weight="700">4</text><text x="694" y="390" font-size="22" fill="#173d34" font-weight="700">Khởi động và mở giao diện</text><text x="644" y="433" font-size="17" fill="#607668" font-weight="400">Bật Start on boot / Watchdog → Start.</text><text x="644" y="460" font-size="17" fill="#607668" font-weight="400">Open Web UI → đăng nhập admin.</text><text x="40" y="573" font-size="16" fill="#315a46" font-weight="400">Router phải truy cập được ingest_url qua LAN/VPN. Kiểm tra fetch và scheduler trước khi cài collector.</text></svg>