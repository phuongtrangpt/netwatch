name: Kiểm tra và phát hành NetWatch
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netwatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - id: release
        name: Kiểm tra phiên bản và cấu hình add-on
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/check-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Cài trình duyệt kiểm tra giao diện
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Kiểm tra đăng nhập và giao diện máy tính/điện thoại
        run: node scripts/browser-brand-check.mjs
      - name: Lưu ảnh kiểm tra giao diện
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: netwatch-ui-preview
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: check
    if: needs.check.outputs.publish == 'true' && github.repository == 'phuongtrangpt/netwatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và đẩy hai kiến trúc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/phuongtrangpt/netwatch:${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/phuongtrangpt/netwatch
            org.opencontainers.image.title=NetWatch
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chạy thử ARM64 trực tiếp và ARMv7 qua QEMU
        env:
          IMAGE: ghcr.io/phuongtrangpt/netwatch:${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/arm64 linux/arm/v7; do
            docker run -d --name netwatch-smoke --platform "$platform" -e NETWATCH_PASSWORD='ci-temporary-test-password-only' "$IMAGE"
            healthy=false
            for attempt in $(seq 1 45); do
              if docker exec netwatch-smoke node -e "fetch('http://127.0.0.1:8080/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                healthy=true
                break
              fi
              sleep 2
            done
            docker logs netwatch-smoke
            docker rm -fv netwatch-smoke
            if [ "$healthy" != true ]; then exit 1; fi
          done
      - name: Hướng dẫn sau phát hành
        run: |
          echo 'Image: ghcr.io/phuongtrangpt/netwatch:${{ needs.check.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lần đầu: chuyển GHCR package netwatch sang Public trước khi cài từ HAOS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cài add-on bằng repository https://github.com/phuongtrangpt/netwatch' >> "$GITHUB_STEP_SUMMARY"
