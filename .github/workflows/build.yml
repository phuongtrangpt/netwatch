name: Kiểm tra và phát hành NetWatch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netwatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-launch-check:
    runs-on: windows-latest
    steps:
      - name: Check background PowerShell startup
        shell: pwsh
        run: |
          $env:PROBE_ROOT=Join-Path $env:RUNNER_TEMP ('probe '+[char]0x0111+' spaces')
          New-Item -ItemType Directory -Force -Path $env:PROBE_ROOT | Out-Null
          @'
          import {spawn} from 'node:child_process';
          import {writeFileSync,existsSync,openSync,closeSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root=process.env.PROBE_ROOT,ps=join(process.env.SystemRoot,'System32/WindowsPowerShell/v1.0/powershell.exe'),script=join(root,'check.ps1'),mark=join(root,'started'),logPath=join(root,'output.log');
          writeFileSync(script,"param([string]$Marker)\n[IO.File]::WriteAllText($Marker,'started')");
          const quote=v=>"'"+v.replaceAll("'","''")+"'",cmd=Buffer.from(`& ${quote(script)} -Marker ${quote(mark)}`,'utf16le').toString('base64'),log=openSync(logPath,'a');
          const child=spawn(ps,['-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-EncodedCommand',cmd],{cwd:root,detached:false,stdio:['ignore',log,log],windowsHide:true});closeSync(log);
          const code=await new Promise((resolve,reject)=>{child.once('error',reject);child.once('exit',resolve);});
          console.log({code,started:existsSync(mark),log:readFileSync(logPath,'utf8')});if(code!==0||!existsSync(mark))process.exit(1);
          '@ | node --input-type=module
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - id: release
        name: Kiểm tra phiên bản và cấu hình add-on
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/check-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
  publish:
    needs: check
    if: needs.check.outputs.publish == 'true' && github.repository == 'phuongtrangpt/netwatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,amd64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và đẩy hai kiến trúc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/phuongtrangpt/netwatch:${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/phuongtrangpt/netwatch
            org.opencontainers.image.title=NetWatch
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chạy thử ARM64 trực tiếp, AMD64 và ARMv7 qua QEMU
        env:
          IMAGE: ghcr.io/phuongtrangpt/netwatch:${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/arm64 linux/amd64 linux/arm/v7; do
            docker run -d --name netwatch-smoke --platform "$platform" -e NETWATCH_PASSWORD='ci-temporary-test-password-only' "$IMAGE"
            healthy=false
            for attempt in $(seq 1 45); do
              if docker exec netwatch-smoke node -e "fetch('http://127.0.0.1:8080/healthz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                healthy=true
                break
              fi
              sleep 2
            done
            docker logs netwatch-smoke
            docker rm -fv netwatch-smoke
            if [ "$healthy" != true ]; then exit 1; fi
          done
      - name: Hướng dẫn sau phát hành
        run: |
          echo 'Image: ghcr.io/phuongtrangpt/netwatch:${{ needs.check.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lần đầu: chuyển GHCR package netwatch sang Public trước khi cài từ HAOS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cài add-on bằng repository https://github.com/phuongtrangpt/netwatch' >> "$GITHUB_STEP_SUMMARY"

  windows-package:
    needs: check
    if: github.repository == 'phuongtrangpt/netwatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Tạo gói Windows x64 có sẵn Node.js
        shell: pwsh
        run: |
          npm ci --omit=dev --no-audit --no-fund
          $package = Join-Path $env:RUNNER_TEMP 'netwatch-windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item (Get-Command node).Source (Join-Path $package 'node.exe')
          Copy-Item 'dist' $package -Recurse
          Copy-Item 'drizzle' $package -Recurse
          Copy-Item 'node_modules' $package -Recurse
          Copy-Item 'package.json' $package
          Copy-Item 'packaging/windows/start-netwatch.ps1' $package
          Copy-Item 'packaging/windows/Start-NetWatch.bat' $package
          Copy-Item 'packaging/windows/README.txt' $package
          Copy-Item 'packaging/windows/update-netwatch.ps1' $package
          $artifact = Join-Path $env:RUNNER_TEMP "netwatch-windows-x64-${{ needs.check.outputs.version }}.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $artifact -CompressionLevel Optimal
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          Copy-Item $artifact 'artifacts/'
      - name: Smoke test gói Windows
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'netwatch-windows-x64'
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'netwatch-windows-smoke-data'
          $env:NETWATCH_PASSWORD = 'windows-smoke-password-123'
          $env:PORT = '18090'
          $node = Join-Path $package 'node.exe'
          $server = Join-Path $package 'dist/server.mjs'
          $process = Start-Process -FilePath $node -ArgumentList "`"$server`"" -WorkingDirectory $package -PassThru -NoNewWindow
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18090/healthz').StatusCode -eq 200) { $healthy = $true; break } } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) { throw 'Windows package did not start or failed its health check.' }
            if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18090/login').StatusCode -ne 200) { throw 'Windows login page did not load.' }
            @'
            import assert from 'node:assert/strict';
            const origin='http://127.0.0.1:18090';
            const login=await fetch(origin+'/login',{method:'POST',redirect:'manual',headers:{origin,'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:'admin',password:process.env.NETWATCH_PASSWORD})});
            assert.equal(login.status,303,'Windows login must redirect successfully');
            const cookie=login.headers.get('set-cookie')?.split(';')[0];
            assert.ok(cookie,'Windows login must set a session cookie');
            const page=await fetch(origin+'/',{headers:{cookie}});
            assert.equal(page.status,200);
            const html=await page.text();
            const assets=[...html.matchAll(/(?:src|href)="([^" ]+\.(?:js|css))"/g)].map(m=>m[1]);
            assert.ok(assets.some(p=>p.endsWith('.js')),'Dashboard must reference JavaScript');
            assert.ok(assets.some(p=>p.endsWith('.css')),'Dashboard must reference CSS');
            for(const asset of assets){
              const r=await fetch(new URL(asset,origin),{headers:{cookie}});
              assert.equal(r.status,200,'Windows dashboard asset: '+asset);
              assert.match(r.headers.get('content-type')||'',asset.endsWith('.js')?/javascript/:/text\/css/);
              assert.ok((await r.text()).length>0);
            }
            assert.equal((await fetch(origin+'/api/session',{headers:{cookie}})).status,200);
            console.log('Windows login, dashboard, JavaScript, CSS and session passed.');
          '@ | & $node --input-type=module
            if ($LASTEXITCODE -ne 0) { throw 'Windows authenticated dashboard smoke test failed.' }
          }
          finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: Test Windows updater and rollback
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'netwatch-windows-x64'
          $archive = (Get-ChildItem 'artifacts/netwatch-windows-x64-*.zip' | Select-Object -First 1).FullName
          ./tests/windows-updater.ps1 -Package $package -Archive $archive
      - uses: actions/upload-artifact@v6
        with:
          name: netwatch-windows-x64
          path: artifacts/netwatch-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [check, publish, windows-package]
    if: needs.check.outputs.publish == 'true' && github.repository == 'phuongtrangpt/netwatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: netwatch-windows-x64
          path: release-assets
      - name: Xuất GitHub Release kèm bộ cài Windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.check.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          asset=$(find release-assets -maxdepth 1 -type f -name 'netwatch-windows-x64-*.zip' -print -quit)
          test -n "$asset"
          node scripts/update-manifest.mjs "$asset" release-assets/netwatch-update.json
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" release-assets/netwatch-update.json --repo "$GH_REPO" --clobber
          else
            cat > release-assets/notes.txt <<EOF
          Image Docker: ghcr.io/phuongtrangpt/netwatch:${TAG#v}

          Gói Windows x64 có sẵn Node.js: tải file ZIP đính kèm. Docker hỗ trợ linux/amd64, linux/arm64 và linux/arm/v7. Xem README để cài đặt.
          EOF
            node --input-type=module -e 'import {readFileSync} from "node:fs";process.stdout.write("\n"+readFileSync("netwatch/CHANGELOG.md","utf8").split(/\n# /)[0]+"\n")' >> release-assets/notes.txt
            gh release create "$TAG" "$asset" release-assets/netwatch-update.json --repo "$GH_REPO" --target "$SOURCE_SHA" --title "NetWatch ${TAG#v}" --notes-file release-assets/notes.txt
          fi
